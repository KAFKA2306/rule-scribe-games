version: "3"

tasks:
  default:
    desc: タスク一覧を表示
    cmd: task --list

  setup:
    desc: "依存インストール (backend: uv sync, frontend: npm install)"
    cmds:
      - task: setup:backend
      - task: setup:frontend

  setup:backend:
    dir: backend
    cmd: uv sync

  setup:frontend:
    dir: frontend
    cmd: npm install

  dev:
    desc: バックエンドとフロントエンドを同時起動
    deps: [dev:backend, dev:frontend]

  dev:backend:
    desc: FastAPI 開発サーバー (http://localhost:8000)
    dir: backend
    cmd: uv run uvicorn app.main:app --reload --host 0.0.0.0 --port 8000

  dev:frontend:
    desc: Vite 開発サーバー (http://localhost:5173)
    dir: frontend
    cmd: npm run dev -- --host

  build:
    desc: フロントエンドのビルド
    dir: frontend
    cmd: npm run build

  preview:
    desc: フロントエンドのプレビュー (ビルド後)
    dir: frontend
    cmd: npm run preview

  lint:
    desc: Lint / format (backend Ruff, frontend Prettier+ESLint)
    cmds:
      - defer: |
          cache_dir="/tmp/claude-statusline-$(whoami)"
          mkdir -p "$cache_dir"
          echo '{{if .EXIT_CODE}}fail{{else}}ok{{end}}' > "$cache_dir/lint"
      - task: lint:backend
      - task: lint:frontend

  format:
    desc: "Format and check Python code (app, api, scripts, tests)"
    dir: backend
    cmds:
      - uv run ruff format app api scripts tests
      - uv run ruff check --fix app api scripts tests

  lint:backend:
    dir: backend
    cmds:
      - uv run ruff check --fix app api scripts tests
      - uv run ruff format app api scripts tests

  tycheck:backend:
    desc: Pythonの静的型チェック (Pyright)
    dir: backend
    cmd: uv run --with pyright pyright app api scripts tests

  lint:frontend:
    dir: frontend
    cmds:
      - npm run format
      - npm run lint:fix

  db:init:
    desc: DB初期化用SQLを表示
    cmd: cat backend/init_db.sql

  clean:
    desc: キャッシュとビルドアーティファクトの削除
    ignore_error: true
    cmds:
      - find . -type d -name "__pycache__" -exec rm -rf {} +
      - rm -rf backend/.ruff_cache
      - rm -rf frontend/dist

  kill:
    desc: 開発サーバーのポート(8000, 5173)を強制解放
    ignore_error: true
    cmds:
      - fuser -k 8000/tcp
      - fuser -k 5173/tcp

  issues:
    desc: GitHub Issue一覧を表示 (開発ループの起点)
    cmd: gh issue list --limit 20

  issues:critical:
    desc: 重要なIssueを表示 (開発ループの優先順位)
    cmd: gh issue list --label "critical" --limit 10 || gh issue list --limit 5

  test:
    desc: Run backend tests and cache result for status line
    dir: backend
    cmds:
      - defer: |
          cache_dir="/tmp/claude-statusline-$(whoami)"
          mkdir -p "$cache_dir"
          echo '{{if .EXIT_CODE}}fail{{else}}pass{{end}}' > "$cache_dir/test"
      - uv run pytest tests/ -q

  validate-urls:
    desc: DBの全ゲームURLをread-only監査（DB更新なし）
    dir: backend
    cmd: uv run python -m app.scripts.validate_urls

  validate-urls:recent:
    desc: 過去24時間更新のゲームURLをread-only監査
    dir: backend
    cmd: uv run python -m app.scripts.validate_urls --hours 24

  validate-urls:apply:
    desc: 確認済み400/404/410 URLをNULL化（明示的なproduction write）
    dir: backend
    cmd: uv run python -m app.scripts.validate_urls --apply

  game:add:
    desc: "curated gameを一次情報検証→read-only identity preflight→生成してPR準備。production writeはmerge後に自動実行 (GAME=<slug>)"
    requires:
      vars: [GAME]
    dir: backend
    cmd: uv run python app/scripts/curated_game_fast_path_v2.py add --game "{{.GAME}}"

  game:check:
    desc: "curated game入力・generated guide・deployment manifestをoffline検証 (GAME=<slug>)"
    requires:
      vars: [GAME]
    dir: backend
    cmd: uv run python app/scripts/curated_game_fast_path_v2.py check --game "{{.GAME}}"

  game:verify:
    desc: "catalogとfrontend releaseの両fixed pointを検証 (GAME=<slug>)"
    requires:
      vars: [GAME]
    dir: backend
    cmd: uv run python app/scripts/curated_game_fast_path_v2.py verify --game "{{.GAME}}"

  game:release-check:
    desc: "production frontendのcurated registry revisionをmainと照合"
    dir: backend
    cmd: uv run python app/scripts/curated_game_fast_path_v2.py release-check

  image:gen:ai:
    desc: "Generate AI image (Usage: task image:gen:ai PROMPT='...' OUTPUT='path/to/img.png')"
    dir: backend
    cmd: uv run python scripts/generate_image_local.py "{{.PROMPT}}" "{{.OUTPUT}}" --width {{.WIDTH | default 1280}} --height {{.HEIGHT | default 670}}

  image:gen:composite:
    desc: "Create composite header (Usage: task image:gen:composite OUTPUT='...' INPUTS='img1 img2 ...')"
    dir: backend
    cmd: uv run python scripts/create_composite_header.py --output "{{.OUTPUT}}" {{.INPUTS}}
