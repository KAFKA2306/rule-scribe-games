name: Test catalog integrity

on:
  pull_request:
    paths:
      - "backend/app/core/supabase.py"
      - "backend/app/models/**"
      - "backend/app/routers/auth.py"
      - "backend/app/routers/games.py"
      - "backend/app/services/catalog_access.py"
      - "backend/app/services/game_service.py"
      - "backend/app/services/seo_renderer.py"
      - "backend/app/services/sitemap.py"
      - "backend/app/db/migrations/**"
      - "backend/tests/test_auth.py"
      - "backend/tests/test_catalog_trust_contract.py"
      - "backend/tests/test_games_router.py"
      - "backend/tests/test_seo_renderer.py"
      - "backend/tests/test_sitemap.py"
      - "frontend/src/components/game/ExternalLinks.jsx"
      - "frontend/src/pages/GamePage.jsx"
      - "vercel.json"
      - ".github/workflows/test-catalog-integrity.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "frontend/package.json"
      - "frontend/package-lock.json"
  push:
    branches:
      - main
    paths:
      - "backend/app/core/supabase.py"
      - "backend/app/models/**"
      - "backend/app/routers/auth.py"
      - "backend/app/routers/games.py"
      - "backend/app/services/catalog_access.py"
      - "backend/app/services/game_service.py"
      - "backend/app/services/seo_renderer.py"
      - "backend/app/services/sitemap.py"
      - "backend/app/db/migrations/**"
      - "backend/tests/test_auth.py"
      - "backend/tests/test_catalog_trust_contract.py"
      - "backend/tests/test_games_router.py"
      - "backend/tests/test_seo_renderer.py"
      - "backend/tests/test_sitemap.py"
      - "frontend/src/components/game/ExternalLinks.jsx"
      - "frontend/src/pages/GamePage.jsx"
      - "vercel.json"
      - ".github/workflows/test-catalog-integrity.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "frontend/package.json"
      - "frontend/package-lock.json"

permissions:
  contents: read

jobs:
  catalog-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install Python dependencies
        run: uv sync --frozen --dev

      - name: Compile backend
        run: uv run python -m compileall -q backend/app

      - name: Run catalog regression tests
        env:
          PYTHONPATH: backend
        run: >-
          uv run pytest -q
          backend/tests/test_auth.py
          backend/tests/test_catalog_trust_contract.py
          backend/tests/test_games_router.py
          backend/tests/test_seo_renderer.py
          backend/tests/test_sitemap.py

      - name: Verify compatible rollout then independent cleanup migrations
        shell: bash
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE TABLE public.games (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            slug text,
            source_url text,
            official_url text,
            is_official boolean DEFAULT false,
            structured_data jsonb DEFAULT '{}'::jsonb
          );
          INSERT INTO public.games(slug, official_url, is_official)
          VALUES (NULL, 'https://example.invalid/legacy', true);
          INSERT INTO public.games(slug, official_url, structured_data)
          VALUES (
            'publisher-game',
            'https://publisher.example/game',
            '{"source_documents":[{"type":"publisher_official"}]}'::jsonb
          );
          SQL

          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/app/db/migrations/006_catalog_integrity_contract.sql
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from pg_constraint where conname='games_slug_required' and convalidated=false;")" = "1"
          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO public.games(slug) VALUES (NULL);"; then
            echo "new null slug unexpectedly accepted before reconciliation"
            exit 1
          fi

          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/app/db/migrations/007_catalog_acl_trust_and_strict_slug.sql
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from information_schema.columns where table_schema='public' and table_name='games' and column_name in ('source_trust','content_review_status');")" = "2"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from information_schema.columns where table_schema='public' and table_name='games' and column_name in ('is_official','official_url');")" = "2"
          test "$(psql "$DATABASE_URL" -Atc "select coalesce(source_url,'') from public.games where slug is null;")" = ""
          test "$(psql "$DATABASE_URL" -Atc "select source_url from public.games where slug='publisher-game';")" = "https://publisher.example/game"
          test "$(psql "$DATABASE_URL" -Atc "select source_trust from public.games where slug='publisher-game';")" = "official_publisher"

          # Reconcile historical invalid rows, then validate the slug invariant.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM public.games WHERE slug IS NULL OR btrim(slug)='';"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/app/db/migrations/008_validate_games_slug.sql
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from pg_constraint where conname='games_slug_required' and convalidated=true;")" = "1"
          # Slug validation is independent: legacy trust fields are still present.
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from information_schema.columns where table_schema='public' and table_name='games' and column_name in ('is_official','official_url');")" = "2"
          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO public.games(slug) VALUES (NULL);"; then
            echo "null slug unexpectedly accepted after validation"
            exit 1
          fi

          # Final trust cleanup is a distinct post-deploy step.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/app/db/migrations/009_remove_legacy_trust.sql
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from information_schema.columns where table_schema='public' and table_name='games' and column_name in ('is_official','official_url');")" = "0"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from information_schema.tables where table_schema='public' and table_name in ('catalog_editors','catalog_mutation_audit');")" = "2"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
