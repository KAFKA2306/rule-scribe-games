name: Backend RuleSet PR

on:
  pull_request:
    paths:
      - "backend/app/services/rulesets.py"
      - "backend/app/services/seo_renderer.py"
      - "backend/app/routers/games.py"
      - "backend/tests/test_ruleset_identity.py"
      - "backend/tests/test_ruleset_read_failure.py"
      - "requirements.txt"
      - ".github/workflows/backend-ruleset-pr.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - name: Compile changed production modules
        run: python -m py_compile backend/app/services/rulesets.py backend/app/services/seo_renderer.py backend/app/routers/games.py
      - name: Run RuleSet contract tests
        working-directory: backend
        run: python -m pytest -q tests/test_ruleset_identity.py tests/test_ruleset_read_failure.py
