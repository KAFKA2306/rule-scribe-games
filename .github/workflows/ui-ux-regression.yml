name: UI UX regression

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/ui-ux-regression.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/ui-ux-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_test
      VITE_API_TIMEOUT_MS: "800"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify source-bound public messaging
        working-directory: frontend
        shell: bash
        run: |
          if grep -Fq "AIでルールを瞬時に要約" index.html; then
            echo "Unsupported instant-AI claim returned to public metadata"
            exit 1
          fi
          if grep -Fq "世界中のボードゲームのルールを瞬時に要約" index.html; then
            echo "Unsupported worldwide instant-summary claim returned to public metadata"
            exit 1
          fi
          grep -Fq "AI生成・要約を含む情報は公式資料と区別して確認してください" index.html

      - name: Reject retired dark palette literals in JSX surfaces
        working-directory: frontend
        shell: bash
        run: |
          if grep -RniE --include='*.jsx' "background[^\n]*(#000([;,'\" }]|$)|#0a0a0a|#0b1221|#111([;,'\" }]|$)|#141414|#1a1a1a|#222([;,'\" }]|$)|#2a2a2a|rgba?\(0,[[:space:]]*0,[[:space:]]*0)" src; then
            echo "Retired dark-theme background literal found in a JSX surface. Use KAFKA SIGNAL tokens/classes instead."
            exit 1
          fi

      - name: Diagnose src lint
        continue-on-error: true
        working-directory: frontend
        run: npx eslint src

      - name: Diagnose tests lint
        continue-on-error: true
        working-directory: frontend
        run: npx eslint tests

      - name: Diagnose config lint
        continue-on-error: true
        working-directory: frontend
        run: npx eslint playwright.config.js vite.config.js

      - name: Lint frontend and UX contracts
        working-directory: frontend
        run: npm run lint

      - name: Gate UI UX accessibility source contracts
        working-directory: frontend
        run: node scripts/check-uiux-accessibility-contracts.mjs

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Gate existing list navigation loading auth image and canonical rule projection contracts
        working-directory: frontend
        run: >-
          npx playwright test
          tests/lists.spec.js
          tests/navigation.spec.js
          tests/performance.spec.js
          tests/game_layout.spec.js
          tests/game_page_title_trust.spec.js
          tests/game_section_navigation.spec.js
          tests/mobile_game_scroll.spec.js
          tests/auth.spec.js
          tests/generated-game-images.spec.js
          tests/text_to_speech.spec.js
          tests/source_links.spec.js
          tests/pili_pili_ruleset_context.spec.js
          tests/directory-source-trust.spec.js
          tests/ruleset-public-projection.spec.js
          tests/canonical_glossary.spec.js
          tests/rule_lookup_glossary_alias.spec.js
          --project=chromium

      - name: Gate responsive geometry and pixel screenshot baselines
        working-directory: frontend
        run: npx playwright test tests/lists_layout.spec.js --project=chromium

      - name: Gate cross-flow UX and accessibility at 375 768 and 1440 widths
        working-directory: frontend
        run: >-
          npx playwright test
          tests/ui_ux_regression.spec.js
          tests/uiux_a11y_regression.spec.js
          --project=ux-mobile
          --project=ux-tablet
          --project=ux-desktop

      - name: Gate palette contrast and legacy dark-state regressions
        working-directory: frontend
        run: >-
          npx playwright test tests/palette_regression.spec.js
          --project=ux-mobile
          --project=ux-tablet
          --project=ux-desktop

      - name: Upload reviewable UI UX evidence
        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-ux-regression-evidence
          path: |
            frontend/tests/lists_layout.spec.js-snapshots/*.png
            frontend/test-results/**/*
          if-no-files-found: ignore
          retention-days: 14
