name: Dependency repair

on:
  push:
    branches:
      - fix/dependency-security-audit
    paths:
      - ".github/workflows/dependency-repair.yml"
      - "frontend/package.json"
      - "frontend/package-lock.json"

permissions:
  contents: write

jobs:
  repair-lockfile:
    if: "${{ contains(github.event.head_commit.message, 'chore: refresh audited dependency lockfile') == false }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/dependency-security-audit
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply non-breaking npm audit fixes to lockfile
        working-directory: frontend
        run: npm audit fix --package-lock-only
      - name: Verify install and production audit
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: Commit repaired lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/package-lock.json; then
            echo "No lockfile change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore: refresh audited dependency lockfile"
          git push origin HEAD:fix/dependency-security-audit
