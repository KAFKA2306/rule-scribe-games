name: Dependency repair

on:
  push:
    branches:
      - fix/dependency-security-audit
    paths:
      - ".github/workflows/dependency-repair.yml"
      - "frontend/package.json"
      - "frontend/package-lock.json"

permissions:
  contents: write

jobs:
  repair-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/dependency-security-audit
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Refresh lockfile and apply non-breaking audit fixes
        working-directory: frontend
        run: |
          npm install --package-lock-only
          npm audit fix --package-lock-only || true
      - name: Commit repaired lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/package-lock.json; then
            echo "No lockfile change required."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/package-lock.json
            git commit -m "chore: refresh audited dependency lockfile"
            git fetch origin fix/dependency-security-audit
            git rebase origin/fix/dependency-security-audit
            git push origin HEAD:fix/dependency-security-audit
          fi
      - name: Verify production dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: Print complete audit JSON
        working-directory: frontend
        run: npm audit --json || true
      - name: Gate all high-severity dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
