name: Mechanical DNA contract

on:
  pull_request:
    paths:
      - "backend/app/main.py"
      - "backend/app/models/mechanical_dna.py"
      - "backend/app/routers/mechanical_dna.py"
      - "backend/app/services/mechanical_dna.py"
      - "backend/tests/test_mechanical_dna.py"
      - "frontend/src/pages/GamePage.jsx"
      - ".github/workflows/test-mechanical-dna.yml"
  push:
    branches: [main]
    paths:
      - "backend/app/main.py"
      - "backend/app/models/mechanical_dna.py"
      - "backend/app/routers/mechanical_dna.py"
      - "backend/app/services/mechanical_dna.py"
      - "backend/tests/test_mechanical_dna.py"
      - "frontend/src/pages/GamePage.jsx"
      - ".github/workflows/test-mechanical-dna.yml"

permissions:
  contents: read

jobs:
  mechanical-dna:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install Python dependencies
        run: uv sync --frozen --dev

      - name: Compile Mechanical DNA modules
        run: >-
          uv run python -m compileall -q
          backend/app/models/mechanical_dna.py
          backend/app/services/mechanical_dna.py
          backend/app/routers/mechanical_dna.py
          backend/app/main.py

      - name: Run Mechanical DNA contract tests
        env:
          PYTHONPATH: backend
        run: uv run pytest -q backend/tests/test_mechanical_dna.py

      - name: Gate canonical connection source path
        run: |
          grep -Fq '/api/games/${slug}/connections?limit=8' frontend/src/pages/GamePage.jsx
          ! grep -Fq '/api/games?limit=50' frontend/src/pages/GamePage.jsx
          ! grep -Fq 'mechanics?.includes(' frontend/src/pages/GamePage.jsx
          grep -Fq 'game_concepts' backend/app/services/mechanical_dna.py
          grep -Fq 'source_bound' backend/app/services/mechanical_dna.py
          grep -Fq 'verified' backend/app/services/mechanical_dna.py

      - name: Build frontend
        run: npm --prefix frontend ci && npm --prefix frontend run build
