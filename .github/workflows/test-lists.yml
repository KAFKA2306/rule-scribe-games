name: Test user lists backend

on:
  pull_request:
    paths:
      - "backend/app/db/migrations/005_user_lists.sql"
      - "backend/app/db/tests/list_integration.sql"
      - "backend/app/routers/lists.py"
      - "backend/app/services/list_service.py"
      - "backend/app/main.py"
      - "backend/tests/test_lists.py"
      - ".github/workflows/test-lists.yml"
  push:
    branches:
      - main
    paths:
      - "backend/app/db/migrations/005_user_lists.sql"
      - "backend/app/db/tests/list_integration.sql"
      - "backend/app/routers/lists.py"
      - "backend/app/services/list_service.py"
      - "backend/app/main.py"
      - "backend/tests/test_lists.py"
      - ".github/workflows/test-lists.yml"

permissions:
  contents: read

jobs:
  database-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PGPASSWORD: postgres
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v5
      - name: Apply list migration and verify RLS/reorder/dedupe/system-list behavior
        run: psql "$DATABASE_URL" -f backend/app/db/tests/list_integration.sql
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --frozen --dev
      - name: Run backend list authorization tests
        run: uv run pytest -q backend/tests/test_lists.py backend/tests/test_auth.py
