name: Frontend layout regression

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-layout.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  game-layout:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify source-bound public messaging
        working-directory: frontend
        shell: bash
        run: |
          if grep -Fq "AIでルールを瞬時に要約" index.html; then
            echo "Unsupported instant-AI claim returned to public metadata"
            exit 1
          fi
          if grep -Fq "世界中のボードゲームのルールを瞬時に要約" index.html; then
            echo "Unsupported worldwide instant-summary claim returned to public metadata"
            exit 1
          fi
          grep -Fq "AI生成・要約を含む情報は公式資料と区別して確認してください" index.html

      - name: Lint changed frontend surface
        working-directory: frontend
        run: npx eslint src/main.jsx src/auth/AuthContext.jsx src/auth/authContext.js src/components/AuthControlPortal.jsx src/components/LoginButton.jsx src/lib/api.js src/lib/supabase.js src/pages/ListsPage.jsx tests/game_layout.spec.js tests/lists_layout.spec.js tests/auth.spec.js playwright.config.js

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Test game layout and auth mounting
        working-directory: frontend
        run: npx playwright test tests/game_layout.spec.js tests/auth.spec.js --project=chromium

      - name: Test lists geometry and screenshot regression
        id: lists_visual
        continue-on-error: true
        working-directory: frontend
        run: npx playwright test tests/lists_layout.spec.js --project=chromium

      - name: Seed reviewed missing screenshot baselines
        if: ${{ github.event_name == 'pull_request' && steps.lists_visual.outcome == 'failure' && github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: frontend
        shell: bash
        run: |
          if [ ! -d tests/lists_layout.spec.js-snapshots ]; then
            echo "No generated baseline directory found"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/lists_layout.spec.js-snapshots/*.png
          if git diff --cached --quiet; then
            echo "No missing baseline files to commit"
            exit 1
          fi
          git commit -m "test: add lists screenshot baselines"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Fail when screenshot regression remains
        if: ${{ steps.lists_visual.outcome == 'failure' }}
        run: exit 1

      - name: Upload lists screenshot diagnostics
        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: lists-layout-screenshot-diagnostics
          path: |
            frontend/tests/lists_layout.spec.js-snapshots/**/*.png
            frontend/test-results/**/*.png
            frontend/test-results/**/*.txt
          if-no-files-found: ignore
          retention-days: 7
