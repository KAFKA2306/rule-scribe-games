name: Temporary security lock refresh

on:
  push:
    branches:
      - fix/python-audit-findings
    paths:
      - ".github/workflows/refresh-security-lock.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor == 'KAFKA2306'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/python-audit-findings
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Refresh the locked dependency graph
        run: uv lock --upgrade
      - name: Verify refreshed runtime dependencies
        shell: bash
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "Refresh Python dependencies after security audit"
          git push origin HEAD:fix/python-audit-findings
