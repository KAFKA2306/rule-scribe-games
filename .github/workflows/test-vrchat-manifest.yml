name: VRChat manifest contract

on:
  pull_request:
    paths:
      - "backend/app/models/vrchat_manifest.py"
      - "backend/app/services/vrchat_manifest_projection.py"
      - "backend/app/models/ruleset.py"
      - "backend/app/models/rule_graph.py"
      - "backend/app/models/component_catalog.py"
      - "backend/tests/test_vrchat_manifest.py"
      - "evaluation/vrchat/manifest-v1-fixtures.json"
      - "schemas/vrchat/board-game-module-manifest-v1.schema.json"
      - "docs/VRCHAT_MANIFEST_V1.md"
      - ".github/workflows/test-vrchat-manifest.yml"
  push:
    branches:
      - main
    paths:
      - "backend/app/models/vrchat_manifest.py"
      - "backend/app/services/vrchat_manifest_projection.py"
      - "backend/app/models/ruleset.py"
      - "backend/app/models/rule_graph.py"
      - "backend/app/models/component_catalog.py"
      - "backend/tests/test_vrchat_manifest.py"
      - "evaluation/vrchat/manifest-v1-fixtures.json"
      - "schemas/vrchat/board-game-module-manifest-v1.schema.json"
      - "docs/VRCHAT_MANIFEST_V1.md"
      - ".github/workflows/test-vrchat-manifest.yml"

permissions:
  contents: read

jobs:
  vrchat-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install Python dependencies
        run: uv sync --frozen --dev

      - name: Compile VRChat manifest modules
        run: uv run python -m compileall -q backend/app/models/vrchat_manifest.py backend/app/services/vrchat_manifest_projection.py

      - name: Ruff VRChat manifest modules and tests
        run: uv run --with ruff ruff check backend/app/models/vrchat_manifest.py backend/app/services/vrchat_manifest_projection.py backend/tests/test_vrchat_manifest.py

      - name: Run VRChat manifest contract tests
        env:
          PYTHONPATH: backend
        run: uv run pytest -q backend/tests/test_vrchat_manifest.py
