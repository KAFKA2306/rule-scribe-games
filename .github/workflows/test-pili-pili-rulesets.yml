name: Pili Pili RuleSet contract

on:
  pull_request:
    paths:
      - "backend/app/db/migrations/022_seed_pili_pili_rulesets.sql"
      - ".github/workflows/test-pili-pili-rulesets.yml"
  push:
    branches: [main]
    paths:
      - "backend/app/db/migrations/022_seed_pili_pili_rulesets.sql"
      - ".github/workflows/test-pili-pili-rulesets.yml"

permissions:
  contents: read

jobs:
  ruleset-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pili_pili_ruleset_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pili_pili_ruleset_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pili_pili_ruleset_test

    steps:
      - uses: actions/checkout@v5

      - name: Build canonical schema and apply seed twice
        shell: bash
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE public.game_works (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid()
          );
          CREATE TABLE public.games (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            slug text NOT NULL UNIQUE,
            title text,
            work_id uuid REFERENCES public.game_works(id),
            identity_status text NOT NULL DEFAULT 'unverified'
          );
          INSERT INTO public.game_works DEFAULT VALUES;
          INSERT INTO public.games(slug, title, work_id, identity_status)
          SELECT 'pili-pili', 'Pili Pili', id, 'verified' FROM public.game_works LIMIT 1;
          SQL

          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/app/db/migrations/010_rule_graph.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/app/db/migrations/013_ruleset_identity.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/app/db/migrations/014_component_catalog.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/app/db/migrations/015_claim_evidence.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/app/db/migrations/022_seed_pili_pili_rulesets.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/app/db/migrations/022_seed_pili_pili_rulesets.sql

      - name: Verify edition isolation and unresolved publisher conflict
        shell: bash
        run: |
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from public.rule_sets rs join public.games g on g.id=rs.game_id where g.slug='pili-pili';")" = "2"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from public.rule_sets rs join public.games g on g.id=rs.game_id where g.slug='pili-pili' and rs.platform='physical' and rs.language_code='fr' and rs.verification_status='source_bound' and rs.source_ids=ARRAY['publisher:atm:pili-pili:current']::text[];")" = "1"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from public.rule_sets rs join public.games g on g.id=rs.game_id where g.slug='pili-pili' and rs.platform='Board Game Arena' and rs.language_code='ja' and rs.revision_label='260623-1715' and rs.verification_status='source_bound' and rs.source_ids=ARRAY['bga:pili-pili:260623-1715']::text[];")" = "1"

          # Stable physical facts are accepted, while the conflicting Pili count is not.
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from public.claims where claim_id='pili-pili:physical:mission-count' and lifecycle_status='accepted' and normalized_payload->>'value'='40';")" = "1"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from public.claims where rule_set_id=(select id from public.rule_sets where platform='physical') and field_path='components.pili_cards' and lifecycle_status='candidate';")" = "2"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from public.evidence_bindings where claim_id like 'pili-pili:physical:pili-count-%' and relation='contradicts';")" = "2"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from public.claims where rule_set_id=(select id from public.rule_sets where platform='physical') and field_path='components.pili_cards' and lifecycle_status='accepted';")" = "0"

          # BGA-specific component counts and end condition stay inside the BGA RuleSet.
          test "$(psql "$DATABASE_URL" -Atc "select normalized_payload->>'value' from public.claims c join public.rule_sets rs on rs.id=c.rule_set_id where rs.platform='Board Game Arena' and c.field_path='components.mission_cards';")" = "36"
          test "$(psql "$DATABASE_URL" -Atc "select normalized_payload->>'value' from public.claims c join public.rule_sets rs on rs.id=c.rule_set_id where rs.platform='Board Game Arena' and c.field_path='components.pili_cards';")" = "17"
          test "$(psql "$DATABASE_URL" -Atc "select normalized_payload->>'pili_threshold' from public.claims c join public.rule_sets rs on rs.id=c.rule_set_id where rs.platform='Board Game Arena' and c.field_path='rules.game_end';")" = "6"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from public.claims c join public.rule_sets rs on rs.id=c.rule_set_id where rs.platform='physical' and c.field_path='rules.game_end';")" = "0"
