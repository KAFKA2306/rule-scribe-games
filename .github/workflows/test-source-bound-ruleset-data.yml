name: Source-bound RuleSet data contract

on:
  pull_request:
    paths:
      - "backend/app/db/migrations/032_seed_azul_sintra_2019_ruleset.sql"
      - "backend/app/db/migrations/033_seed_disney_lorcana_cr_2_2_0_ruleset.sql"
      - "backend/app/db/migrations/034_seed_hackclad_base_ruleset.sql"
      - "backend/app/db/migrations/035_extend_hackclad_base_faq_rules.sql"
      - "backend/app/db/migrations/036_seed_sky_team_2024_ja_ruleset.sql"
      - "backend/app/db/migrations/037_seed_brass_birmingham_2019_ja_ruleset.sql"
      - "backend/app/db/migrations/038_seed_elfenland_amigo_v3_ruleset.sql"
      - ".github/workflows/test-source-bound-ruleset-data.yml"
      - ".github/workflows/test-azul-sintra-ruleset-data.yml"
  push:
    branches: [main]
    paths:
      - "backend/app/db/migrations/032_seed_azul_sintra_2019_ruleset.sql"
      - "backend/app/db/migrations/033_seed_disney_lorcana_cr_2_2_0_ruleset.sql"
      - "backend/app/db/migrations/034_seed_hackclad_base_ruleset.sql"
      - "backend/app/db/migrations/035_extend_hackclad_base_faq_rules.sql"
      - "backend/app/db/migrations/036_seed_sky_team_2024_ja_ruleset.sql"
      - "backend/app/db/migrations/037_seed_brass_birmingham_2019_ja_ruleset.sql"
      - "backend/app/db/migrations/038_seed_elfenland_amigo_v3_ruleset.sql"
      - ".github/workflows/test-source-bound-ruleset-data.yml"
      - ".github/workflows/test-azul-sintra-ruleset-data.yml"

permissions:
  contents: read

jobs:
  ruleset-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: source_bound_ruleset_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d source_bound_ruleset_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/source_bound_ruleset_test

    steps:
      - uses: actions/checkout@v5

      - name: Build canonical schema and seed fixture games
        shell: bash
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE public.game_works (id uuid PRIMARY KEY DEFAULT gen_random_uuid());
          CREATE TABLE public.games (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            slug text NOT NULL UNIQUE,
            title text,
            description text,
            rules jsonb NOT NULL DEFAULT '{}'::jsonb,
            work_id uuid REFERENCES public.game_works(id),
            identity_status text NOT NULL DEFAULT 'unverified',
            identity_source text,
            source_url text,
            official_url text,
            source_trust text,
            content_review_status text,
            rules_content text,
            structured_data jsonb,
            summary text,
            setup_summary text,
            gameplay_summary text,
            end_game_summary text,
            edition_label text,
            language_code text,
            publisher text,
            source_revision text,
            min_players integer,
            max_players integer,
            play_time integer,
            min_age integer,
            published_year integer,
            title_ja text,
            title_en text,
            bgg_url text,
            amazon_url text,
            is_official boolean,
            updated_at timestamptz NOT NULL DEFAULT now()
          );

          WITH w AS (INSERT INTO public.game_works DEFAULT VALUES RETURNING id)
          INSERT INTO public.games(slug,title,work_id,identity_status,source_url,source_trust,rules_content,published_year,min_players,max_players,min_age,play_time)
          SELECT 'azul-stained-glass-of-sintra','Azul: Stained Glass of Sintra',id,'verified','https://hobbyjapan.games/azul_stained_glass_of_sintra/','official_publisher','legacy summary incorrectly defers completed-pattern scoring to round end',2018,2,4,8,30 FROM w;

          WITH w AS (INSERT INTO public.game_works DEFAULT VALUES RETURNING id)
          INSERT INTO public.games(slug,title,work_id,identity_status,source_url,source_trust,rules_content,min_players,max_players,min_age,play_time)
          SELECT 'disney-lorcana','Disney Lorcana',id,'unverified','https://disneylorcana.jp/','unknown','legacy summary: 60-card deck, ink, quest, challenge, 20 lore',2,2,8,25 FROM w;

          WITH w AS (INSERT INTO public.game_works DEFAULT VALUES RETURNING id)
          INSERT INTO public.games(
            slug,title,title_ja,title_en,work_id,identity_status,source_url,official_url,source_trust,
            rules_content,structured_data,summary,description,published_year,min_players,max_players,play_time,bgg_url,amazon_url,is_official
          )
          SELECT 'hack-clad','Hack Clad','ハッククラッド -Hack Clad-','Hack Clad',id,'unverified',
                 'https://kentaiki.booth.pm/items/4710078','https://kentaiki.booth.pm/items/4710078','unknown',
                 'legacy unrelated adventure equipment-market rules','{"keywords":[{"term":"ファンタジー"}]}'::jsonb,
                 '冒険者となり装備を集めモンスターを倒す別ゲームの要約',
                 'サイバーパンク世界でハッカーとして侵入する別ゲームの説明',2023,2,4,60,
                 'https://boardgamegeek.com/boardgame/385617/hack-clad','https://www.amazon.co.jp/s?k=Hack%20Clad',false
          FROM w;

          WITH w AS (INSERT INTO public.game_works DEFAULT VALUES RETURNING id)
          INSERT INTO public.games(
            slug,title,title_ja,work_id,identity_status,source_url,source_trust,content_review_status,
            rules_content,structured_data,summary,description,min_players,max_players,play_time,amazon_url
          )
          SELECT 'sky-team','Sky Team','スカイチーム',id,'unverified','https://www.scorpionmasque.com/en/sky-team','unknown','unknown',
                 'legacy summary includes generic setup and fuel-exhaustion loss','{"keywords":[{"term":"無言の連携"}]}'::jsonb,
                 '2人協力型で飛行機を安全に着陸させるダイスプレイスメントゲーム',
                 'ダイスを配置して飛行機の速度、高度、フラップ、ギアなどを管理する',2,2,20,
                 'https://www.amazon.co.jp/s?k=%E3%82%B9%E3%82%AB%E3%82%A4%E3%83%81%E3%83%BC%E3%83%A0&tag=bodogemikata-22'
          FROM w;

          WITH w AS (INSERT INTO public.game_works DEFAULT VALUES RETURNING id)
          INSERT INTO public.games(
            slug,title,title_ja,title_en,work_id,identity_status,source_url,source_trust,content_review_status,
            rules_content,structured_data,summary,description,min_players,max_players,play_time,min_age,published_year
          )
          SELECT 'brass-birmingham','Brass Birmingham','ブラス：バーミンガム','Brass: Birmingham',id,'unverified',
                 'https://boardgamegeek.com/boardgame/224517/brass-birmingham','unknown','unknown',
                 'legacy rules mix unspecified Brass-era summary','{"keywords":[{"term":"産業革命"}]}'::jsonb,
                 '産業革命をテーマにした経済ゲーム','運河と鉄道を使う重量級ゲーム',2,4,120,14,2018
          FROM w;

          WITH w AS (INSERT INTO public.game_works DEFAULT VALUES RETURNING id)
          INSERT INTO public.games(
            slug,title,title_ja,title_en,work_id,identity_status,source_url,source_trust,content_review_status,
            rules_content,structured_data,summary,description,min_players,max_players,amazon_url
          )
          SELECT 'elfenland','Elfenland','エルフェンランド','Elfenland',id,'unverified',
                 'https://www.riograndegames.com/games/elfenland/','unknown','unknown',
                 'legacy rules cover setup, four rounds, transport planning, movement and scoring','{}'::jsonb,
                 'エルフとして街を巡るゲーム','移動手段を計画してできるだけ多くの街を訪れる',2,6,
                 'https://www.amazon.co.jp/s?k=%E3%82%A8%E3%83%AB%E3%83%95%E3%82%A7%E3%83%B3%E3%83%A9%E3%83%B3%E3%83%89&tag=bodogemikata-22'
          FROM w;
          SQL

          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/app/db/migrations/010_rule_graph.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/app/db/migrations/011_concept_taxonomy.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/app/db/migrations/013_ruleset_identity.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/app/db/migrations/014_component_catalog.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/app/db/migrations/015_claim_evidence.sql

      - name: Apply source-bound seeds twice
        shell: bash
        run: |
          for pass in 1 2; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/app/db/migrations/032_seed_azul_sintra_2019_ruleset.sql
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/app/db/migrations/033_seed_disney_lorcana_cr_2_2_0_ruleset.sql
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/app/db/migrations/034_seed_hackclad_base_ruleset.sql
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/app/db/migrations/035_extend_hackclad_base_faq_rules.sql
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/app/db/migrations/036_seed_sky_team_2024_ja_ruleset.sql
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/app/db/migrations/037_seed_brass_birmingham_2019_ja_ruleset.sql
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/app/db/migrations/038_seed_elfenland_amigo_v3_ruleset.sql
          done

      - name: Verify Azul Sintra contract remains intact
        shell: bash
        run: |
          test "$(psql "$DATABASE_URL" -Atc "select identity_status from public.games where slug='azul-stained-glass-of-sintra';")" = "verified"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from public.rule_sets rs join public.games g on g.id=rs.game_id where g.slug='azul-stained-glass-of-sintra' and rs.verification_status='source_bound';")" = "1"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from public.rule_nodes rn join public.rule_sets rs on rs.id=rn.rule_set_id join public.games g on g.id=rs.game_id where g.slug='azul-stained-glass-of-sintra' and rn.verification_status='source_bound';")" = "10"

      - name: Verify Lorcana living-rules contract
        shell: bash
        run: |
          test "$(psql "$DATABASE_URL" -Atc "select identity_status from public.games where slug='disney-lorcana';")" = "verified"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from public.rule_sets rs join public.games g on g.id=rs.game_id where g.slug='disney-lorcana' and rs.revision_label='cr-2.2.0-ja-2026-07-10' and rs.verification_status='source_bound';")" = "1"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from public.rule_nodes rn join public.rule_sets rs on rs.id=rn.rule_set_id join public.games g on g.id=rs.game_id where g.slug='disney-lorcana' and rn.verification_status='source_bound';")" = "10"

      - name: Verify HacKClaD contaminated identity is removed and source-bound facts survive
        shell: bash
        run: |
          test "$(psql "$DATABASE_URL" -Atc "select title from public.games where slug='hack-clad';")" = "HacKClaD"
          test "$(psql "$DATABASE_URL" -Atc "select identity_status from public.games where slug='hack-clad';")" = "verified"
          test "$(psql "$DATABASE_URL" -Atc "select identity_source from public.games where slug='hack-clad';")" = "https://www.hackclad.jp/home"
          test "$(psql "$DATABASE_URL" -Atc "select min_players||':'||max_players from public.games where slug='hack-clad';")" = "1:4"
          test "$(psql "$DATABASE_URL" -Atc "select rules::text from public.games where slug='hack-clad';")" = "{}"
          test -z "$(psql "$DATABASE_URL" -Atc "select rules_content from public.games where slug='hack-clad';")"
          test "$(psql "$DATABASE_URL" -Atc "select structured_data::text from public.games where slug='hack-clad';")" = "{}"
          test -z "$(psql "$DATABASE_URL" -Atc "select bgg_url from public.games where slug='hack-clad';")"
          test -z "$(psql "$DATABASE_URL" -Atc "select amazon_url from public.games where slug='hack-clad';")"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from public.rule_sets rs join public.games g on g.id=rs.game_id where g.slug='hack-clad' and rs.platform='physical' and rs.language_code='ja' and rs.edition_label='基本セット HacKClaD（通常版）' and rs.revision_label='base-official-web-2026-08-23' and rs.verification_status='source_bound' and rs.is_active;")" = "1"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from public.rule_nodes rn join public.rule_sets rs on rs.id=rn.rule_set_id join public.games g on g.id=rs.game_id where g.slug='hack-clad' and rn.verification_status='source_bound';")" = "11"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from public.claims c join public.rule_sets rs on rs.id=c.rule_set_id join public.games g on g.id=rs.game_id where g.slug='hack-clad' and c.target_type='rule_node' and c.lifecycle_status='accepted';")" = "11"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from public.evidence_bindings eb join public.claims c on c.claim_id=eb.claim_id join public.rule_sets rs on rs.id=c.rule_set_id join public.games g on g.id=rs.game_id where g.slug='hack-clad' and eb.relation='supports';")" = "11"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from public.rule_nodes rn join public.claims c on c.rule_set_id=rn.rule_set_id and c.rule_id=rn.rule_id where rn.rule_set_id=(select rs.id from public.rule_sets rs join public.games g on g.id=rs.game_id where g.slug='hack-clad') and c.normalized_payload->>'statement'=rn.normalized_statement;")" = "11"
          test "$(psql "$DATABASE_URL" -Atc "select position('ダメージに等しいVP分の魔石' in normalized_statement)>0 from public.rule_nodes rn join public.rule_sets rs on rs.id=rn.rule_set_id join public.games g on g.id=rs.game_id where g.slug='hack-clad' and rn.rule_id='scoring.damage-magic-stones';")" = "t"
          test "$(psql "$DATABASE_URL" -Atc "select position('自動的に終了' in normalized_statement)>0 from public.rule_nodes rn join public.rule_sets rs on rs.id=rn.rule_set_id join public.games g on g.id=rs.game_id where g.slug='hack-clad' and rn.rule_id='turn.injury-ends-turn';")" = "t"
          test "$(psql "$DATABASE_URL" -Atc "select position('移動攻撃として扱い' in normalized_statement)>0 from public.rule_nodes rn join public.rule_sets rs on rs.id=rn.rule_set_id join public.games g on g.id=rs.game_id where g.slug='hack-clad' and rn.rule_id='reaction.effect-caused-movement';")" = "t"
          test "$(psql "$DATABASE_URL" -Atc "select position('捨て札にした後' in normalized_statement)>0 from public.rule_nodes rn join public.rule_sets rs on rs.id=rn.rule_set_id join public.games g on g.id=rs.game_id where g.slug='hack-clad' and rn.rule_id='action.knockback-resolution-order';")" = "t"
          test "$(psql "$DATABASE_URL" -Atc "select normalized_statement from public.rule_nodes rn join public.rule_sets rs on rs.id=rn.rule_set_id join public.games g on g.id=rs.game_id where g.slug='hack-clad' and rn.rule_id='condition.multiple-missions';")" = "条件を満たしている場合、複数のミッションを同時に達成できる。"
          test "$(psql "$DATABASE_URL" -Atc "select position('使用したものとして扱う' in normalized_statement)>0 from public.rule_nodes rn join public.rule_sets rs on rs.id=rn.rule_set_id join public.games g on g.id=rs.game_id where g.slug='hack-clad' and rn.rule_id='action.card-use-established';")" = "t"

      - name: Verify Sky Team Japanese base-game contract
        shell: bash
        run: |
          test "$(psql "$DATABASE_URL" -Atc "select identity_status from public.games where slug='sky-team';")" = "verified"
          test "$(psql "$DATABASE_URL" -Atc "select identity_source from public.games where slug='sky-team';")" = "https://sugorokuya.jp/p/sky-team"
          test "$(psql "$DATABASE_URL" -Atc "select edition_label from public.games where slug='sky-team';")" = "スカイチーム 日本語版（2024年6月）"
          test "$(psql "$DATABASE_URL" -Atc "select min_players||':'||max_players||':'||play_time||':'||min_age||':'||published_year from public.games where slug='sky-team';")" = "2:2:20:12:2024"
          test "$(psql "$DATABASE_URL" -Atc "select rules::text from public.games where slug='sky-team';")" = "{}"
          test -z "$(psql "$DATABASE_URL" -Atc "select rules_content from public.games where slug='sky-team';")"
          test "$(psql "$DATABASE_URL" -Atc "select structured_data::text from public.games where slug='sky-team';")" = "{}"
          test "$(psql "$DATABASE_URL" -Atc "select position('bodogemikata-22' in amazon_url)>0 from public.games where slug='sky-team';")" = "t"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from public.rule_sets rs join public.games g on g.id=rs.game_id where g.slug='sky-team' and rs.platform='physical' and rs.language_code='ja' and rs.edition_label='スカイチーム 日本語版（2024年6月）' and rs.revision_label='landing-procedure-2023-06-06-ja-2024-06' and rs.verification_status='source_bound' and rs.is_active;")" = "1"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from public.rule_nodes rn join public.rule_sets rs on rs.id=rn.rule_set_id join public.games g on g.id=rs.game_id where g.slug='sky-team' and rn.verification_status='source_bound';")" = "13"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from public.claims c join public.rule_sets rs on rs.id=c.rule_set_id join public.games g on g.id=rs.game_id where g.slug='sky-team' and c.target_type='rule_node' and c.lifecycle_status='accepted';")" = "13"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from public.evidence_bindings eb join public.claims c on c.claim_id=eb.claim_id join public.rule_sets rs on rs.id=c.rule_set_id join public.games g on g.id=rs.game_id where g.slug='sky-team' and eb.relation='supports';")" = "13"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from public.rule_nodes rn join public.claims c on c.rule_set_id=rn.rule_set_id and c.rule_id=rn.rule_id where rn.rule_set_id=(select rs.id from public.rule_sets rs join public.games g on g.id=rs.game_id where g.slug='sky-team') and c.normalized_payload->>'statement'=rn.normalized_statement;")" = "13"
          test "$(psql "$DATABASE_URL" -Atc "select position('上級モジュール用の部品は基本ゲームでは使わない' in normalized_statement)>0 from public.rule_nodes rn join public.rule_sets rs on rs.id=rn.rule_set_id join public.games g on g.id=rs.game_id where g.slug='sky-team' and rn.rule_id='setup.montreal-basic';")" = "t"
          test "$(psql "$DATABASE_URL" -Atc "select position('ラウンド終了まで会話しない' in normalized_statement)>0 from public.rule_nodes rn join public.rule_sets rs on rs.id=rn.rule_set_id join public.games g on g.id=rs.game_id where g.slug='sky-team' and rn.rule_id='round.communication';")" = "t"
          test "$(psql "$DATABASE_URL" -Atc "select position('衝突' in normalized_statement)>0 and position('オーバーシュート' in normalized_statement)>0 from public.rule_nodes rn join public.rule_sets rs on rs.id=rn.rule_set_id join public.games g on g.id=rs.game_id where g.slug='sky-team' and rn.rule_id='action.engines';")" = "t"
          test "$(psql "$DATABASE_URL" -Atc "select position('進入トラック上に飛行機コマが無く' in normalized_statement)>0 and position('完全に水平' in normalized_statement)>0 and position('ブレーキ値より小さければ' in normalized_statement)>0 from public.rule_nodes rn join public.rule_sets rs on rs.id=rn.rule_set_id join public.games g on g.id=rs.game_id where g.slug='sky-team' and rn.rule_id='game.victory';")" = "t"

      - name: Verify Brass Birmingham Japanese edition contract
        shell: bash
        run: |
          test "$(psql "$DATABASE_URL" -Atc "select identity_status from public.games where slug='brass-birmingham';")" = "verified"
          test "$(psql "$DATABASE_URL" -Atc "select edition_label from public.games where slug='brass-birmingham';")" = "ブラス：バーミンガム 完全日本語版（2019年11月28日）"
          test "$(psql "$DATABASE_URL" -Atc "select min_players||':'||max_players||':'||play_time||':'||min_age||':'||published_year from public.games where slug='brass-birmingham';")" = "2:4:120:14:2019"
          test "$(psql "$DATABASE_URL" -Atc "select rules::text from public.games where slug='brass-birmingham';")" = "{}"
          test -z "$(psql "$DATABASE_URL" -Atc "select rules_content from public.games where slug='brass-birmingham';")"
          test "$(psql "$DATABASE_URL" -Atc "select structured_data::text from public.games where slug='brass-birmingham';")" = "{}"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from public.rule_sets rs join public.games g on g.id=rs.game_id where g.slug='brass-birmingham' and rs.platform='physical' and rs.language_code='ja' and rs.edition_label='ブラス：バーミンガム 完全日本語版（2019年11月28日）' and rs.revision_label='roxley-2018.11.20-ja-2019-11-28' and rs.verification_status='source_bound' and rs.is_active;")" = "1"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from public.rule_nodes rn join public.rule_sets rs on rs.id=rn.rule_set_id join public.games g on g.id=rs.game_id where g.slug='brass-birmingham' and rn.verification_status='source_bound';")" = "14"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from public.claims c join public.rule_sets rs on rs.id=c.rule_set_id join public.games g on g.id=rs.game_id where g.slug='brass-birmingham' and c.target_type='rule_node' and c.lifecycle_status='accepted';")" = "14"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from public.evidence_bindings eb join public.claims c on c.claim_id=eb.claim_id join public.rule_sets rs on rs.id=c.rule_set_id join public.games g on g.id=rs.game_id where g.slug='brass-birmingham' and eb.relation='supports';")" = "14"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from public.rule_nodes rn join public.claims c on c.rule_set_id=rn.rule_set_id and c.rule_id=rn.rule_id where rn.rule_set_id=(select rs.id from public.rule_sets rs join public.games g on g.id=rs.game_id where g.slug='brass-birmingham') and c.normalized_payload->>'statement'=rn.normalized_statement;")" = "14"
