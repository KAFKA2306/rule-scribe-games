name: Generate RuleOps batch 03 migration

on:
  push:
    branches:
      - ruleops/batch-03-migration
    paths:
      - ".github/workflows/generate-ruleops-batch-03.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ruleops/batch-03-migration

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install Python dependencies
        run: uv sync --frozen --dev

      - name: Generate migration with canonical RuleOps generator
        env:
          PYTHONPATH: backend
        run: |
          uv run python backend/app/scripts/ruleops_generate_migration.py \
            backend/app/ruleops/manifests/2026-08-26-batch-03.json \
            --migration-number 073

      - name: Commit generated migration only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/db/migrations/073_ruleops_2026_08_26_batch_03.sql
          git diff --cached --exit-code && exit 1 || true
          git commit -m "generate RuleOps batch 03 migration"
          git push origin HEAD:ruleops/batch-03-migration
