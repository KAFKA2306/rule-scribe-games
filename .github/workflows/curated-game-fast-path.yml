name: Curated game release

on:
  push:
    branches:
      - main
    paths:
      - "data/curated-games/**"
      - "backend/app/scripts/curated_game_workflow.py"
      - "backend/app/scripts/curated_game_fast_path_v2.py"
      - "backend/tests/test_curated_game_workflow.py"
      - "backend/tests/test_curated_game_fast_path_v2.py"
      - "frontend/scripts/generate-curated-game-artifacts.mjs"
      - "frontend/package.json"
      - "frontend/src/lib/curatedRuleGuides.js"
      - ".gitignore"
      - "Taskfile.yml"
      - "docs/CURATED_GAME_FAST_PATH.md"
      - ".github/workflows/curated-game-pr-checks.yml"
      - ".github/workflows/curated-game-fast-path.yml"
      - ".github/workflows/curated-game-release-verification.yml"

permissions:
  contents: read

jobs:
  curated-game:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - name: Install Python dependencies
        run: uv sync --frozen --dev
      - name: Run focused workflow tests
        env:
          PYTHONPATH: backend
        run: >-
          uv run pytest -q
          backend/tests/test_curated_game_workflow.py
          backend/tests/test_curated_game_fast_path_v2.py
      - name: Regenerate and validate all curated artifacts from source
        env:
          PYTHONPATH: backend
        run: uv run python backend/app/scripts/curated_game_fast_path_v2.py check-all

  publish-catalog:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: curated-game
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: curated-catalog-publish
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve changed curated specs from main diff
        id: changed
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
          fi

          mapfile -t removed < <(
            git diff --name-only --diff-filter=DR "$BEFORE_SHA" "$GITHUB_SHA" -- data/curated-games/ \
              | grep -E '^data/curated-games/[^/]+\.json$' \
              | grep -v '/schema-' \
              || true
          )
          if ((${#removed[@]} > 0)); then
            printf 'Curated game deletion requires an explicit deprecation workflow: %s\n' "${removed[*]}" >&2
            exit 1
          fi

          mapfile -t changed < <(
            git diff --name-only --diff-filter=AM "$BEFORE_SHA" "$GITHUB_SHA" -- data/curated-games/ \
              | grep -E '^data/curated-games/[^/]+\.json$' \
              | grep -v '/schema-' \
              | sed -E 's#^data/curated-games/##; s#\.json$##' \
              | sort -u \
              || true
          )

          printf '%s\n' "${changed[@]}" | sed '/^$/d' > /tmp/curated-games.txt
          echo "count=${#changed[@]}" >> "$GITHUB_OUTPUT"
          echo "Changed curated games: ${#changed[@]}"
      - name: Install uv
        if: steps.changed.outputs.count != '0'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - name: Install Python dependencies
        if: steps.changed.outputs.count != '0'
        run: uv sync --frozen
      - name: Install Vercel CLI
        if: steps.changed.outputs.count != '0'
        run: npm install --global vercel@59.0.0
      - name: Pull production environment only
        if: steps.changed.outputs.count != '0'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Export trusted Supabase server credentials
        if: steps.changed.outputs.count != '0'
        shell: bash
        run: |
          python - .vercel/.env.production.local "$GITHUB_ENV" <<'PY'
          import sys
          from pathlib import Path

          source = Path(sys.argv[1])
          destination = Path(sys.argv[2])
          values = {}
          for raw in source.read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              value = value.strip()
              if len(value) >= 2 and value[0] == value[-1] and value[0] in "'\"":
                  value = value[1:-1]
              values[key.strip()] = value
          required = ("SUPABASE_URL", "SUPABASE_SERVICE_ROLE_KEY")
          missing = [key for key in required if not values.get(key)]
          if missing:
              raise SystemExit("Missing trusted production DB variables: " + ", ".join(missing))
          with destination.open("a", encoding="utf-8") as output:
              for key in required:
                  output.write(f"{key}={values[key]}\n")
          print("Trusted production DB environment loaded")
          PY
      - name: Publish changed curated games and verify catalog fixed points
        if: steps.changed.outputs.count != '0'
        env:
          PYTHONPATH: backend
        shell: bash
        run: |
          while IFS= read -r slug; do
            [ -n "$slug" ] || continue
            uv run python backend/app/scripts/curated_game_fast_path_v2.py publish --game "$slug"
          done < /tmp/curated-games.txt
