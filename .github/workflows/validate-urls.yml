name: Validate URLs

on:
  schedule:
    - cron: "0 9,21 * * *" # 18:00 / 06:00 JST
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply destructive NULL updates for confirmed 400/404/410 results"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Validate URLs
        working-directory: backend
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APPLY_URL_FIXES: ${{ github.event_name == 'workflow_dispatch' && inputs.apply || false }}
        run: |
          args=()
          if [ "$APPLY_URL_FIXES" = "true" ]; then
            args+=(--apply)
          fi
          uv run python -m app.scripts.validate_urls "${args[@]}"
