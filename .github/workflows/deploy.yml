name: Vercel Deployment

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Build-Preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build PR without deployment secrets
        working-directory: frontend
        run: npm run build

  Production-Build-And-Verify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install Vercel CLI
        run: npm install --global vercel@59.0.0
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Verify Supabase auth and server environment contract
        shell: bash
        run: |
          python - .vercel/.env.production.local VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          required = sys.argv[2:]
          values = {}
          if path.exists():
              for raw in path.read_text(encoding="utf-8").splitlines():
                  line = raw.strip()
                  if not line or line.startswith("#") or "=" not in line:
                      continue
                  key, value = line.split("=", 1)
                  value = value.strip()
                  if len(value) >= 2 and value[0] == value[-1] and value[0] in "'\"":
                      value = value[1:-1]
                  values[key.strip()] = value
          missing = [key for key in required if not values.get(key)]
          if missing:
              print("Missing required Vercel environment variables: " + ", ".join(missing))
              raise SystemExit(1)
          print("Supabase auth/server environment contract: OK")
          PY
      - name: Verify Google OAuth provider redirect
        run: python scripts/check_google_oauth.py .vercel/.env.production.local
      - name: Build Production with Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Inspect Vercel deployment budget
        id: budget
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          python scripts/vercel_deployment_budget.py
          --sha "${GITHUB_SHA}"
          --project-id "${VERCEL_PROJECT_ID}"
          --team-id "${VERCEL_ORG_ID}"
      - name: Record quota-deferred production state
        if: steps.budget.outputs.state == 'quota_saturated'
        run: |
          echo "Production build passed; deployment is deferred because the Vercel team is at the observed 24h deployment limit." >> "$GITHUB_STEP_SUMMARY"
          echo "No deployment creation was attempted by GitHub Actions." >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy latest main once
        if: steps.budget.outputs.state == 'deployable'
        id: deploy
        shell: bash
        run: |
          set +e
          output="$(vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }} 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$output"
          if [ "$code" -eq 0 ]; then
            echo "deployed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$output" | grep -Fq 'api-deployments-free-per-day'; then
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "Push deployment reached Vercel quota after preflight; deployment is deferred without retry." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$code"
      - name: Verify production deployment
        if: steps.deploy.outputs.deployed == 'true' || steps.budget.outputs.state == 'current' || steps.budget.outputs.state == 'unknown'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          python scripts/verify_vercel_git_deployment.py
          --sha "${GITHUB_SHA}"
          --project-id "${VERCEL_PROJECT_ID}"
          --team-id "${VERCEL_ORG_ID}"
          --timeout-seconds 180
          --poll-seconds 5

  Production-Catch-Up:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Inspect Vercel deployment budget
        id: budget
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          python scripts/vercel_deployment_budget.py
          --sha "${GITHUB_SHA}"
          --project-id "${VERCEL_PROJECT_ID}"
          --team-id "${VERCEL_ORG_ID}"
      - name: Record deferred catch-up
        if: steps.budget.outputs.state == 'quota_saturated'
        run: echo "Catch-up deferred; no Vercel deployment was created while the observed 24h budget is saturated." >> "$GITHUB_STEP_SUMMARY"
      - name: Record already-current production
        if: steps.budget.outputs.state == 'current'
        run: echo "Production already matches latest main; catch-up is a no-op." >> "$GITHUB_STEP_SUMMARY"
      - name: Record unknown budget state
        if: steps.budget.outputs.state == 'unknown'
        run: echo "Budget state is unknown; catch-up fails closed and will not create a deployment." >> "$GITHUB_STEP_SUMMARY"
      - name: Install Vercel CLI
        if: steps.budget.outputs.state == 'deployable'
        run: npm install --global vercel@59.0.0
      - name: Pull Vercel Environment Information
        if: steps.budget.outputs.state == 'deployable'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Verify Google OAuth provider redirect
        if: steps.budget.outputs.state == 'deployable'
        run: python scripts/check_google_oauth.py .vercel/.env.production.local
      - name: Build latest main for catch-up
        if: steps.budget.outputs.state == 'deployable'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy latest main once
        if: steps.budget.outputs.state == 'deployable'
        id: catchup
        shell: bash
        run: |
          set +e
          output="$(vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }} 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$output"
          if [ "$code" -eq 0 ]; then
            echo "deployed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$output" | grep -Fq 'api-deployments-free-per-day'; then
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "Catch-up reached Vercel quota after preflight; deployment is deferred without retry." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$code"
      - name: Verify catch-up production deployment
        if: steps.catchup.outputs.deployed == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          python scripts/verify_vercel_git_deployment.py
          --sha "${GITHUB_SHA}"
          --project-id "${VERCEL_PROJECT_ID}"
          --team-id "${VERCEL_ORG_ID}"
          --timeout-seconds 180
          --poll-seconds 5
