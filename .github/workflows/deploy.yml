name: Vercel Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: vercel-${{ github.workflow }}-${{ github.ref }}
  # Never let an hourly catch-up cancel a main-push production verification.
  # A queued catch-up re-checks the exact SHA and becomes a no-op when production is current.
  cancel-in-progress: false

jobs:
  Production-Build-And-Verify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install Vercel CLI
        run: npm install --global vercel@59.0.0
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Verify Supabase auth and server environment contract
        shell: bash
        run: |
          python - .vercel/.env.production.local VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          required = sys.argv[2:]
          values = {}
          if path.exists():
              for raw in path.read_text(encoding="utf-8").splitlines():
                  line = raw.strip()
                  if not line or line.startswith("#") or "=" not in line:
                      continue
                  key, value = line.split("=", 1)
                  value = value.strip()
                  if len(value) >= 2 and value[0] == value[-1] and value[0] in "'\"":
                      value = value[1:-1]
                  values[key.strip()] = value
          missing = [key for key in required if not values.get(key)]
          if missing:
              print("Missing required Vercel environment variables: " + ", ".join(missing))
              raise SystemExit(1)
          print("Supabase auth/server environment contract: OK")
          PY
      - name: Verify Google OAuth provider redirect
        run: python scripts/check_google_oauth.py .vercel/.env.production.local
      - name: Verify IndexNow release selection
        run: python scripts/submit_indexnow.py --self-test
      - name: Record changed files for IndexNow
        shell: bash
        run: git diff --name-status "${{ github.event.before }}" "${GITHUB_SHA}" > /tmp/indexnow-changed-files.tsv
      - name: Build Production with Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Inspect Vercel deployment budget
        id: budget
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          python scripts/vercel_deployment_budget.py
          --sha "${GITHUB_SHA}"
          --project-id "${VERCEL_PROJECT_ID}"
          --team-id "${VERCEL_ORG_ID}"
      - name: Record quota-deferred production state
        if: steps.budget.outputs.state == 'quota_saturated'
        run: |
          echo "Production build passed; deployment is deferred because the Vercel team is at the observed 24h deployment limit." >> "$GITHUB_STEP_SUMMARY"
          echo "No deployment creation was attempted by GitHub Actions." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify canonical Vercel Git production deployment
        id: git_verification
        continue-on-error: true
        if: steps.budget.outputs.state == 'deployable' || steps.budget.outputs.state == 'unknown'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          python scripts/verify_vercel_git_deployment.py
          --sha "${GITHUB_SHA}"
          --project-id "${VERCEL_PROJECT_ID}"
          --team-id "${VERCEL_ORG_ID}"
          --timeout-seconds 180
          --poll-seconds 5
      - name: Deploy production once when Git integration missed exact SHA
        if: steps.budget.outputs.state == 'deployable' && steps.git_verification.outcome == 'failure'
        id: push_fallback
        shell: bash
        run: |
          set +e
          output="$(vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }} 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$output"
          if [ "$code" -eq 0 ]; then
            echo "deployed=true" >> "$GITHUB_OUTPUT"
            echo "Vercel Git integration missed the exact main SHA, so GitHub Actions performed one production fallback deployment." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if printf '%s\n' "$output" | grep -Fq 'api-deployments-free-per-day'; then
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "Fallback reached the Vercel deployment quota after preflight; no retry was attempted." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$code"
      - name: Verify fallback production deployment
        if: steps.push_fallback.outputs.deployed == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          python scripts/verify_vercel_git_deployment.py
          --sha "${GITHUB_SHA}"
          --project-id "${VERCEL_PROJECT_ID}"
          --team-id "${VERCEL_ORG_ID}"
          --timeout-seconds 180
          --poll-seconds 5
      - name: Fail closed when production is still not current
        if: >-
          steps.git_verification.outcome == 'failure' &&
          steps.push_fallback.outputs.deployed != 'true' &&
          steps.budget.outputs.state != 'quota_saturated'
        run: |
          echo "Production still does not match the exact main SHA after verification/fallback." >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Download previous production indexability state
        id: previous_indexability
        if: >-
          steps.budget.outputs.state == 'current' ||
          steps.git_verification.outcome == 'success' ||
          steps.push_fallback.outputs.deployed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/previous-indexability
          artifact_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "production-indexability" and (.expired | not)) | [.created_at, (.id | tostring)] | @tsv' | sort -r | head -n 1 | cut -f 2)"
          if [ -z "$artifact_id" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No previous verified production indexability artifact; this release establishes the baseline and reports the comparison as UNVERIFIED." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/previous-indexability.zip
          unzip -q /tmp/previous-indexability.zip -d /tmp/previous-indexability
          test -f /tmp/previous-indexability/indexability.json
          echo "found=true" >> "$GITHUB_OUTPUT"
      - name: Verify Mechanical DNA production contract
        if: >-
          steps.budget.outputs.state == 'current' ||
          steps.git_verification.outcome == 'success' ||
          steps.push_fallback.outputs.deployed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --base-url https://bodoge-no-mikata.vercel.app
            --indexability-state-output /tmp/current-indexability/indexability.json
          )
          if [ "${{ steps.previous_indexability.outputs.found }}" = "true" ]; then
            args+=(--previous-indexability-state /tmp/previous-indexability/indexability.json)
          fi
          python backend/app/scripts/verify_production_contract.py "${args[@]}" | tee /tmp/production-contract.txt
          {
            echo "### Production search indexability"
            echo '```text'
            cat /tmp/production-contract.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save verified production indexability state
        if: >-
          steps.budget.outputs.state == 'current' ||
          steps.git_verification.outcome == 'success' ||
          steps.push_fallback.outputs.deployed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: production-indexability
          path: /tmp/current-indexability/indexability.json
          if-no-files-found: error
          retention-days: 90
      - name: Notify IndexNow after verified production release
        if: >-
          steps.budget.outputs.state == 'current' ||
          steps.git_verification.outcome == 'success' ||
          steps.push_fallback.outputs.deployed == 'true'
        run: >-
          python scripts/submit_indexnow.py
          --base-url https://bodoge-no-mikata.vercel.app
          --changed-files-file /tmp/indexnow-changed-files.tsv

  Production-Catch-Up:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Inspect Vercel deployment budget
        id: budget
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          python scripts/vercel_deployment_budget.py
          --sha "${GITHUB_SHA}"
          --project-id "${VERCEL_PROJECT_ID}"
          --team-id "${VERCEL_ORG_ID}"
      - name: Record deferred catch-up
        if: steps.budget.outputs.state == 'quota_saturated'
        run: echo "Catch-up deferred; no Vercel deployment was created while the observed 24h budget is saturated." >> "$GITHUB_STEP_SUMMARY"
      - name: Record already-current production
        if: steps.budget.outputs.state == 'current'
        run: echo "Production already matches latest main; catch-up is a no-op." >> "$GITHUB_STEP_SUMMARY"
      - name: Record unknown budget state
        if: steps.budget.outputs.state == 'unknown'
        run: echo "Budget state is unknown; catch-up fails closed and will not create a deployment." >> "$GITHUB_STEP_SUMMARY"
      - name: Install Vercel CLI
        if: steps.budget.outputs.state == 'deployable'
        run: npm install --global vercel@59.0.0
      - name: Pull Vercel Environment Information
        if: steps.budget.outputs.state == 'deployable'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Verify Google OAuth provider redirect
        if: steps.budget.outputs.state == 'deployable'
        run: python scripts/check_google_oauth.py .vercel/.env.production.local
      - name: Deploy latest main once
        if: steps.budget.outputs.state == 'deployable'
        id: catchup
        shell: bash
        run: |
          set +e
          output="$(vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }} 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$output"
          if [ "$code" -eq 0 ]; then
            echo "deployed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$output" | grep -Fq 'api-deployments-free-per-day'; then
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "Catch-up reached Vercel quota after preflight; deployment is deferred without retry." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$code"
      - name: Verify catch-up production deployment
        if: steps.catchup.outputs.deployed == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          python scripts/verify_vercel_git_deployment.py
          --sha "${GITHUB_SHA}"
          --project-id "${VERCEL_PROJECT_ID}"
          --team-id "${VERCEL_ORG_ID}"
          --timeout-seconds 180
          --poll-seconds 5
      - name: Download previous production indexability state
        id: previous_indexability
        if: steps.budget.outputs.state == 'current' || steps.catchup.outputs.deployed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/previous-indexability
          artifact_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "production-indexability" and (.expired | not)) | [.created_at, (.id | tostring)] | @tsv' | sort -r | head -n 1 | cut -f 2)"
          if [ -z "$artifact_id" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No previous verified production indexability artifact; this run establishes the baseline and reports the comparison as UNVERIFIED." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/previous-indexability.zip
          unzip -q /tmp/previous-indexability.zip -d /tmp/previous-indexability
          test -f /tmp/previous-indexability/indexability.json
          echo "found=true" >> "$GITHUB_OUTPUT"
      - name: Verify Mechanical DNA production contract
        if: steps.budget.outputs.state == 'current' || steps.catchup.outputs.deployed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --base-url https://bodoge-no-mikata.vercel.app
            --indexability-state-output /tmp/current-indexability/indexability.json
          )
          if [ "${{ steps.previous_indexability.outputs.found }}" = "true" ]; then
            args+=(--previous-indexability-state /tmp/previous-indexability/indexability.json)
          fi
          python backend/app/scripts/verify_production_contract.py "${args[@]}" | tee /tmp/production-contract.txt
          {
            echo "### Production search indexability"
            echo '```text'
            cat /tmp/production-contract.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save verified production indexability state
        if: steps.budget.outputs.state == 'current' || steps.catchup.outputs.deployed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: production-indexability
          path: /tmp/current-indexability/indexability.json
          if-no-files-found: error
          retention-days: 90
