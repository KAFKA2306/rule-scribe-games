name: Regenerate analytics lockfile

on:
  push:
    branches:
      - fix/480-vercel-web-analytics
    paths:
      - .github/workflows/fix-480-lockfile.yml
      - frontend/package.json

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/480-vercel-web-analytics
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate package lock
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore: sync analytics lockfile"
          git push origin HEAD:fix/480-vercel-web-analytics
